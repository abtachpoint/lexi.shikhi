workflows:
  android-release:
    name: LexiShikhi Final APK + AAB
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        - lexishikhi_upload

    scripts:
      - name: Prepare Gradle 8.14
        script: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'GRADLE_EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          GRADLE_EOF

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            TMP_DIR="$(mktemp -d)"
            flutter create --platforms=android --org com.lexishikhi --project-name wrapper_helper "$TMP_DIR/wrapper_helper"
            cp "$TMP_DIR/wrapper_helper/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            rm -rf "$TMP_DIR"
          fi

          chmod +x android/gradlew
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter packages
        script: |
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build test APK
        script: |
          flutter build apk --release --dart-define=USE_TEST_ADS=true

      - name: Build Play AAB
        script: |
          flutter build appbundle --release --dart-define=USE_TEST_ADS=false

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
