workflows:
  android-release:
    name: LexiShikhi Android APK + AAB
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Prepare Gradle wrapper
        script: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            TMP_DIR="$(mktemp -d)"
            flutter create --platforms=android --org com.lexishikhi --project-name wrapper_helper "$TMP_DIR/wrapper_helper"
            cp "$TMP_DIR/wrapper_helper/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            rm -rf "$TMP_DIR"
          fi
          chmod +x android/gradlew
      - name: Flutter packages
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build APK
        script: |
          flutter build apk --release
      - name: Build AAB
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
